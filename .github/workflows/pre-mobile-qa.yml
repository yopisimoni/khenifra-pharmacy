name: Khénifra pre-mobile QA
on:
  push:
    branches: [main, audit/pre-mobile-2026-11-03]
  pull_request:
    paths:
      - "index.html"
      - "api/**"
      - "tests/**"
      - "scripts/**"
      - "vercel.json"
      - "manifest.webmanifest"
      - "sw.js"
      - "offline.html"
      - "icons/**"
      - ".github/workflows/pre-mobile-qa.yml"
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Python compile
        run: python3 -m compileall -q api scripts tests
      - name: Frontend syntax and translation audit
        run: node scripts/check_frontend.mjs
