    body.splash-open{overflow:hidden}
    .splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at top, rgba(17,122,99,.18), rgba(245,248,246,.98) 45%, rgba(245,248,246,1) 100%);z-index:120;transition:opacity .55s ease, visibility .55s ease}
    .splash.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
    .splash::before,.splash::after{content:"";position:absolute;border-radius:999px;filter:blur(4px);opacity:.55;animation:splashFloat 7s ease-in-out infinite}
    .splash::before{width:240px;height:240px;background:rgba(17,122,99,.12);top:8%;left:10%}
    .splash::after{width:180px;height:180px;background:rgba(13,89,72,.12);bottom:10%;right:12%;animation-delay:-2.4s}
    .splash-card{position:relative;width:min(92vw,560px);background:rgba(255,255,255,.84);backdrop-filter:blur(12px);border:1px solid rgba(216,230,223,.95);box-shadow:0 24px 70px rgba(5,45,35,.12);border-radius:32px;padding:34px 28px 26px;text-align:center;overflow:hidden}
    .splash-card::before{content:"";position:absolute;inset:auto -15% -55% -15%;height:180px;background:radial-gradient(circle at center, rgba(17,122,99,.11), transparent 70%)}
    .splash-logo{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px;animation:splashRise .85s ease both}
    .splash-orb{width:92px;height:92px;border-radius:28px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-weight:900;font-size:40px;box-shadow:0 18px 32px rgba(17,122,99,.28);position:relative;animation:splashPulse 2.2s ease-in-out infinite}
    .splash-orb::after{content:"";position:absolute;inset:-10px;border:1px solid rgba(17,122,99,.18);border-radius:34px}
    .splash-cross{width:46px;height:46px;border-radius:16px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--brand);font-size:24px;font-weight:900;box-shadow:var(--shadow)}
    .splash-kicker{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.18em;margin:0 0 10px;animation:splashRise .85s ease .12s both}
    .splash-title{margin:0;font-size:clamp(32px,6vw,54px);line-height:1.02;font-weight:900;color:var(--ink);animation:splashRise .9s ease .18s both}
    .splash-subtitle{margin:12px 0 0;color:var(--muted);font-size:16px;animation:splashRise .9s ease .26s both}
    .splash-bar{width:min(78%,340px);height:8px;border-radius:999px;background:var(--soft);margin:24px auto 18px;overflow:hidden;border:1px solid var(--line);animation:splashRise .9s ease .34s both}
    .splash-bar>span{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--brand-2));animation:splashLoad 2.1s ease forwards .2s}
    .splash-skip{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 18px;border-radius:999px;cursor:pointer;transition:transform .2s ease, background .2s ease;animation:splashRise .9s ease .42s both}
    .splash-skip:hover{transform:translateY(-1px);background:var(--soft)}
    @keyframes splashRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    @keyframes splashFloat{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-18px) translateX(12px)}}
    @keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
    @keyframes splashLoad{from{width:0}to{width:100%}}
    @media (max-width:640px){.splash-card{padding:30px 20px 22px;border-radius:26px}.splash-orb{width:80px;height:80px;font-size:34px}.splash-cross{width:40px;height:40px;font-size:20px}.splash-kicker{letter-spacing:.12em}}

    };
  }
  function reportMail(pharmacy){ return `mailto:${email}?subject=${encodeURIComponent('Khénifra Pharma report: '+pharmacy.name)}&body=${encodeURIComponent(`${t('reportMsg')}\n\nPharmacy: ${pharmacy.name}\nPhone: ${pharmacy.phone || '-'}\nAddress: ${pharmacy.address || '-'}\n`)}`; }
  function openMapInApp(p){ selectedMapPharmacy = p; switchTab('map'); renderMap(); bindActions(); window.scrollTo({top:0,behavior:'smooth'}); }
  function openDirections(p){ modalPharmacy = p; els.navModal.classList.add('open'); els.navModal.setAttribute('aria-hidden','false'); els.dialogTitle.textContent = `${t('directions')} · ${p.name}`; els.dialogSubtitle.textContent = p.address || ''; els.startLabel.textContent = t('startPoint'); els.startInput.placeholder = t('startPlaceholder'); els.useMyLocation.textContent = t('useMyLocation'); els.showRoute.textContent = t('showRoute'); els.showPlace.textContent = t('showPlace'); els.routeHelp.textContent = t('routeHelp'); const warn = p.locationVerified !== true; els.modalWarn.style.display = warn ? 'flex' : 'none'; els.modalWarnText.textContent = warn ? (lang==='ar'?'الموقع المقترح مبني على اسم الصيدلية وعنوانها، وقد يحتاج تصحيحاً. تأكد من العلامة قبل التوجّه، وأبلغنا عن أي خطأ.':lang==='fr'?'L’emplacement proposé provient du nom et de l’adresse. Vérifiez le repère avant de partir et signalez toute erreur.':'Suggested location is based on the pharmacy name and address. Check the pin before travelling and report any error.') : t('modalWarn'); els.startInput.value=''; const urls = navUrls(p); els.openGoogle.textContent = 'Google Maps'; els.openWaze.textContent = 'Waze'; els.openApple.textContent = 'Apple Maps'; els.openGoogle.href = urls.google; els.openWaze.href = urls.waze; els.openApple.href = urls.apple; els.routeFrame.src = mapEmbedPlace(pharmacyQuery(p)); }
  function closeModal(){ els.navModal.classList.remove('open'); els.navModal.setAttribute('aria-hidden','true'); }
  function chooseMyLocation(){ if(!navigator.geolocation){ alert(lang==='ar'?'تحديد الموقع غير مدعوم على هذا الجهاز.':lang==='fr'?'La géolocalisation n’est pas disponible sur cet appareil.':'Location is not supported on this device.'); return; } navigator.geolocation.getCurrentPosition(pos=>{ currentCoords = `${pos.coords.latitude},${pos.coords.longitude}`; els.startInput.value = currentCoords; }, ()=> alert(lang==='ar'?'تعذر تحديد موقعك. تحقق من إذن الموقع.':lang==='fr'?'Impossible d’accéder à votre position. Vérifiez les autorisations.':'Unable to access your location. Check location permission.')); }
  function showRoute(){ if(!modalPharmacy) return; const origin = (els.startInput.value || 'Khénifra, Morocco').trim(); const destination = pharmacyQuery(modalPharmacy); const urls = navUrls(modalPharmacy, origin); els.openGoogle.href = urls.google; els.openWaze.href = urls.waze; els.openApple.href = urls.apple; if(modalPharmacy.locationVerified===true && Number.isFinite(Number(modalPharmacy.lat)) && Number.isFinite(Number(modalPharmacy.lng))){ els.routeFrame.src=mapEmbedDirections(origin, modalPharmacy.lat+','+modalPharmacy.lng); } else { els.routeFrame.src=mapEmbedPlace(destination); els.routeHelp.textContent=lang==='ar'?'هذا موقع مقترح. تأكد من اسم الصيدلية والعنوان في نتائج الخريطة قبل بدء المسار.':lang==='fr'?'Emplacement suggéré. Vérifiez le nom et l’adresse de la pharmacie avant de lancer l’itinéraire.':'Suggested location. Verify the pharmacy name and address before starting navigation.'; } }
  function showPlace(){ if(!modalPharmacy) return; els.routeFrame.src = mapEmbedPlace(pharmacyQuery(modalPharmacy)); }
  function badge(p){ return `<span class="badge ${p.verified ? 'ok':'warn'}">${p.verified ? t('verified') : t('unverified')}</span>`; }
  function actionButtons(p){ return `<div class="actions">${p.phone?`<a class="btn primary" href="${phoneHref(p)}">☎ ${t('call')}</a>`:''}<button class="btn soft" data-action="directions" data-id="${escapeHtml(p.id || p.name)}">🧭 ${t('directions')}</button></div>`; }
  function smallActions(p){ return `<div class="share-line"><button class="pill" data-action="share-pharmacy" data-id="${escapeHtml(p.id || p.name)}">↗ ${eText('sharePharmacy')}</button></div>`+`<div class="mini-actions"><button class="btn soft" data-action="viewmap" data-id="${escapeHtml(p.id || p.name)}">🗺 ${t('viewOnMap')}</button><button class="btn" data-action="directions" data-id="${escapeHtml(p.id || p.name)}">🧭 ${t('openDirections')}</button>${p.phone?`<a class="btn primary" href="${phoneHref(p)}">☎ ${t('call')}</a>`:''}</div>`; }
  function shareButton(p){return `<div class="share-line"><button class="pill" data-action="share-pharmacy" data-id="${escapeHtml(p.id || p.name)}">↗ ${eText('sharePharmacy')}</button></div>`;}
  function extraDetails(p){ return shareButton(p)+`<details><summary>${t('extra')}</summary><div class="small"><b>${t('source')}:</b> ${escapeHtml(p.source || '-')}<br>${escapeHtml(p.address || '')}<br>${!p.verified ? '⚠ '+t('confirmBefore'):''}</div></details>`; }
  function feedbackRow(p){ return `<div class="feedback"><div class="small">${t('feedbackQ')}</div><div class="choices"><button class="pill" data-action="helpful">${t('yes')}</button><button class="pill" data-action="feedback" data-id="${escapeHtml(p.id || p.name)}">${t('report')}</button></div></div>`; }
  function renderToday(){ const cards = (isNightShiftHours() ? [] : activeDutyPharmacies()).map(p=>`<article class="card"><div class="card-top"><div><div class="badge ok">${t('weekGuardLabel')}</div><div class="name">${escapeHtml(p.nameAr || p.name)}</div></div>${badge(p)}</div><div class="pharmacy">${escapeHtml(p.nameAr || p.name)}<div class="name-fr" lang="fr">${escapeHtml(p.nameFr || ("Pharmacie "+(p.name || "")))}</div></div><div class="address">${escapeHtml(p.address)}</div>${p.phone?`<div class="phone">☎ ${escapeHtml(p.phone)}</div>`:''}${actionButtons(p)}${feedbackRow(p)}${extraDetails(p)}</article>`).join(''); const night = getTodayNight(); const nightCard = night ? `<article class="card night-card"><div class="night-label">${t('nightBadge')}</div><div class="card-top"><div><div class="badge ok">${t('tonight')}</div><div class="name">${escapeHtml(night.nameAr || night.name)}</div></div>${badge(night)}</div><div class="pharmacy">${escapeHtml(night.nameAr || night.name)}<div class="name-fr" lang="fr">${escapeHtml(night.nameFr || night.name || "")}</div></div><div class="address">${formatDate(night.date)}<br>${escapeHtml(night.address)}</div>${night.phone?`<div class="phone">☎ ${escapeHtml(night.phone)}</div>`:night.phoneNeedsReview?`<div class="small">${lang==='ar'?'رقم الهاتف قيد التحقق':lang==='fr'?'Numéro de téléphone en cours de vérification':'Phone number under review'}</div>`:''}${actionButtons(night)}${feedbackRow(night)}${extraDetails(night)}</article>` : '';
    const expired=!currentWeek.start || isoToday()>currentWeek.end;
    const emptyMessage=lang==='ar' ? 'انتهى جدول الحراسة الأسبوعية المنشور. سنعرض الصيدليات الجديدة بعد التأكد من البرنامج المحدث. يرجى الاتصال بالصيدلية أو التحقق محلياً قبل التنقل.' : lang==='fr' ? 'Le planning hebdomadaire publié est terminé. Les nouvelles pharmacies seront affichées après vérification du planning actualisé. Confirmez localement avant de vous déplacer.' : 'The published weekly duty schedule has ended. New duty pharmacies will appear after the updated schedule is verified. Please check locally before travelling.';
    const weekLabel=expired ? (lang==='ar' ? 'تحديث الحراسة الأسبوعية مطلوب' : lang==='fr' ? 'Mise à jour de la garde hebdomadaire nécessaire' : 'Weekly duty update needed') : t('weekSubtitle')+' · '+currentWeek.start+' – '+currentWeek.end;
    const emptyCard= !cards && !nightCard ? `<div class="empty" role="status">${emptyMessage}</div>` : '';
    els.today.innerHTML = `<div class="panel"><div class="section-title"><div><h2>${t('weekTitle')}</h2><p>${weekLabel}</p></div><span class="badge">${t('currentWeekOnly')}</span></div><div class="cards">${cards}${nightCard}${emptyCard}</div></div>`;
  }
  function renderNight(){
    const item = getTodayNight();
    const items = item ? `<article class="card night-card"><div class="night-label">${t('nightBadge')}</div><div class="card-top"><div><div class="badge ok">${formatDate(item.date)}</div><div class="name">${escapeHtml(item.nameAr)}</div></div>${badge(item)}</div><div class="pharmacy">${escapeHtml(item.nameAr)}<div class="name-fr" lang="fr">${escapeHtml(item.nameFr || item.name || "")}</div></div><div class="address">${escapeHtml(item.address)}<br>${item.scheduleBasedOnRotation ? (lang==="ar" ? "⏰ 21:00 – 09:00 (قد تبدأ بعض المناوبات 21:30). يُرجى الاتصال قبل التنقل." : lang==="fr" ? "⏰ 21h00–09h00 (début parfois à 21h30). Appelez avant de vous déplacer." : "⏰ 21:00–09:00 (some shifts start at 21:30). Please call before travelling.") : ("⏰ "+escapeHtml(item.startTime)+" – "+escapeHtml(item.endTime))}</div>${item.phone?`<div class="phone">☎ ${escapeHtml(item.phone)}</div>`:item.phoneNeedsReview?`<div class="small">${lang==='ar'?'رقم الهاتف قيد التحقق':lang==='fr'?'Numéro de téléphone en cours de vérification':'Phone number under review'}</div>`:''}${actionButtons(item)}${feedbackRow(item)}${extraDetails(item)}</article>` : `<div class="empty">${lang==='ar'?'لم نتوصل بعد بجدول الحراسة الليلية المحدّث بعد 1 نونبر 2026. هذا لا يعني عدم وجود صيدلية مناوبة. يُرجى التحقق محلياً قبل التنقل.':lang==='fr'?'Le planning des gardes de nuit après le 1er novembre 2026 n’est pas encore disponible ici. Cela ne signifie pas qu’aucune pharmacie est de garde. Vérifiez localement avant de vous déplacer.':'The night-duty schedule after 1 November 2026 is not yet available here. This does not mean no pharmacy is on duty. Please verify locally before travelling.'}</div>`;
    els.night.innerHTML = `<div class="panel"><div class="section-title"><div><h2>${t('nightTitle')}</h2><p>${item ? formatDate(item.date) + ' · ' + item.startTime + ' – ' + item.endTime : t('noticeBody')}</p></div><span class="badge">${t('nightBadge')}</span></div><div class="cards">${items}</div></div>`;
  }
  function renderHolidays(){
    // Privacy-first view: never publish the full holiday rota or pharmacy names.
    const today = isoToday();
    const upcoming = holidaySchedule.filter(h=>h.date>=today).sort((a,b)=>a.date.localeCompare(b.date))[0];
    const days = upcoming ? Math.round((Date.parse(upcoming.date+'T12:00:00')-Date.parse(today+'T12:00:00'))/86400000) : Infinity;
    const heading = t('tabHolidays');
    const noHoliday = lang==='ar' ? 'لا توجد حراسة أعياد اليوم' : lang==='fr' ? 'Pas de garde de jour férié aujourd’hui' : 'No holiday duty today';
    const nextMsg = lang==='ar' ? 'المناسبة المقبلة' : lang==='fr' ? 'Prochain jour férié' : 'Next holiday';
    const checking = lang==='ar' ? 'تُعرض تفاصيل الحراسة عند اقتراب المناسبة وبعد التحقق منها. اتصل بالصيدلية قبل التنقل.' : lang==='fr' ? 'Les détails de garde seront publiés à l’approche du jour férié, après vérification. Appelez avant de vous déplacer.' : 'Duty details will appear closer to the holiday after verification. Call before travelling.';
    const next = upcoming && days<=14 ? `<p class="small" style="margin-top:12px">${nextMsg}: <strong>${escapeHtml(upcoming[lang]||upcoming.ar)}</strong> · ${escapeHtml(formatDate(upcoming.date))}</p>` : '';
    const current = upcoming && days===0;
    const status = current ? (lang==='ar'?'حراسة العيد قيد التحقق':lang==='fr'?'Garde du jour férié en cours de vérification':'Holiday duty is being verified') : noHoliday;
    document.getElementById('holidays').innerHTML=`<div class="panel"><div class="section-title"><div><h2>${heading}</h2><p>${t('holidayDescription')}</p></div></div><div class="empty" style="text-align:center;padding:34px 18px"><div style="font-size:34px;margin-bottom:8px">📅</div><h3 style="margin:4px 0 8px">${status}</h3><p class="small">${checking}</p>${next}</div><p class="footer-note">${t('holidayNextUpdate')}</p></div>`;
  }
  function renderMap(){
    const visible = activeDutyPharmacies();
    const focus = visible.find(p=>p.id === selectedMapPharmacy?.id) || visible[0] || null;
    const q = focus ? pharmacyQuery(focus) : 'Khénifra, Morocco';
    const frameSrc = MAPS_KEY ? mapEmbedPlace(q) : 'about:blank';
    const currentList = activeDutyPharmacies();
    const cards = currentList.map(p=>`<article class="mini-card"><div class="mini-title"><b>${escapeHtml(p.nameAr || p.name)}</b>${badge(p)}</div><div class="small">${escapeHtml(p.address || '')}</div>${p.phone?`<div class="small">☎ ${escapeHtml(p.phone)}</div>`:''}<div class="small">${lang==='ar'?'موقع مقترح من الاسم والعنوان، تحقق قبل التنقل':lang==='fr'?'Emplacement suggéré, à vérifier avant le trajet':'Suggested location, verify before travelling'}</div>${smallActions(p)}${feedbackRow(p)}</article>`).join('');
    els.map.innerHTML = `<div class="panel"><div class="section-title"><div><h2>${t('mapTitle')}</h2><p>${t('mapSubtitle')}</p></div></div><div class="map-shell"><div class="map-card"><iframe class="map-frame" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${frameSrc}"></iframe></div><div class="list-stack">${cards}</div></div></div>`;
  }
  function renderInfo(){ els.info.innerHTML = `<div class="panel"><div class="section-title"><div><h2>${t('ownerPolicyTitle')}</h2><p>${t('ownerPolicyBody')}</p></div></div><p class="small">${t('noticeBody')}</p></div>`; }
  async function shareThing(p){
    const base=location.origin+location.pathname;
    const url=p?base+'#pharmacy='+encodeURIComponent(p.id||p.name):base;
    const title=p?(p.nameAr||p.name)+' | Khénifra Pharma':'Khénifra Pharma';
    const text=p?`${p.nameAr||p.name} - ${p.phone||''} - ${p.address||''}`:eText('shareTitle');
    if(location.hostname==='localhost'||location.hostname==='127.0.0.1'||location.hostname==='[::1]') alert(eText('localWarning'));
    try{if(navigator.share){await navigator.share({title,text,url});return;}}
    catch(err){if(err.name==='AbortError')return;}
    try{await navigator.clipboard.writeText(url);alert(eText('copiedLink'));}
    catch(err){window.prompt(eText('shareApp'),url);}
  }
  function openLegal(kind){
    const modal=document.getElementById('legalModal');const title=document.getElementById('legalTitle');const content=document.getElementById('legalContent');
    const key=kind==='about'?'about':kind==='privacy'?'privacy':'contactPage';
    title.textContent=eText(key);
    content.replaceChildren();
    const paragraph=document.createElement('p');paragraph.textContent=eText(kind==='about'?'aboutBody':kind==='privacy'?'privacyBody':'contactBody');content.appendChild(paragraph);
    if(kind==='contact'){
      const p=document.createElement('p');p.textContent='☎ '+contactPhone+'  ·  '+email;content.appendChild(p);
      const a=document.createElement('a');a.className='btn soft';a.href='mailto:'+email;a.textContent=t('contact');content.appendChild(a);
    }
    modal.classList.add('open');modal.setAttribute('aria-hidden','false');
  }
  function bindActions(){ document.querySelectorAll('[data-action="share-pharmacy"]').forEach(el=>el.onclick=()=>{const p=findPharmacy(el.dataset.id);if(p)shareThing(p);}); document.querySelectorAll('[data-action="directions"]').forEach(el=> el.onclick = ()=>{ const id = el.getAttribute('data-id'); const p = findPharmacy(id); if(p) openDirections(p); }); document.querySelectorAll('[data-action="viewmap"]').forEach(el=> el.onclick = ()=>{ const id = el.getAttribute('data-id'); const p = findPharmacy(id); if(p) openMapInApp(p); }); document.querySelectorAll('[data-action="feedback"]').forEach(el=>el.onclick=()=>openFeedback(findPharmacy(el.getAttribute('data-id')))); document.querySelectorAll('[data-action="helpful"]').forEach(el=> el.onclick = ()=> alert(t('thanks') || 'Thanks')); }
  function findPharmacy(id){ return activeDutyPharmacies().find(p => (p.id || p.name) === id); }
  function renderAll(){ els.todayLabel.textContent = formatDate(isoToday()); const nighttime=isNightShiftHours(); els.tabToday.hidden=nighttime; if(nighttime && document.getElementById('today').classList.contains('active')) switchTab('night'); renderToday(); renderNight(); renderHolidays(); renderMap(); renderInfo(); bindActions(); }
  function switchTab(tab){ if(tab==='today' && isNightShiftHours()) tab='night'; document.querySelectorAll('.tabs button').forEach(btn=> btn.classList.toggle('active', btn.dataset.tab===tab)); document.querySelectorAll('.section').forEach(sec=> sec.classList.toggle('active', sec.id===tab)); }

  let selectedFeedbackPharmacy='';
  function feedbackOptions(){ return activeDutyPharmacies(); }
  function updateFeedbackLabels(){
    const f=k=>document.getElementById(k);
    f('feedbackTitle').textContent=t('feedbackTitle'); f('feedbackIntro').textContent=t('feedbackIntro');
    f('feedbackPharmacyLabel').textContent=t('feedbackPharmacyLabel');f('feedbackTypeLabel').textContent=t('feedbackTypeLabel');
    f('feedbackMessageLabel').textContent=t('feedbackMessageLabel');f('feedbackMessage').placeholder=t('feedbackPlaceholder');
    f('feedbackPrivacy').textContent=t('feedbackPrivacy');f('feedbackSend').textContent=t('feedbackSend');
    const types=f('feedbackType').options; tr[lang].feedbackTypes.forEach((x,i)=>types[i].textContent=x);
    f('feedbackPharmacy').innerHTML='<option value="general">'+t('contact')+'</option>'+feedbackOptions().map(p=>'<option value="'+escapeHtml(p.name)+'">'+escapeHtml(p.nameAr||p.name)+'</option>').join('');
    if(selectedFeedbackPharmacy) f('feedbackPharmacy').value=selectedFeedbackPharmacy;
  }
  function openFeedback(p){ selectedFeedbackPharmacy=p ? p.name : ''; updateFeedbackLabels();const m=document.getElementById('feedbackModal');m.classList.add('open');m.setAttribute('aria-hidden','false'); }
  function closeFeedback(){ const m=document.getElementById('feedbackModal');m.classList.remove('open');m.setAttribute('aria-hidden','true'); }
  document.getElementById('openFeedback').addEventListener('click',()=>openFeedback());
  document.getElementById('closeFeedback').addEventListener('click',closeFeedback);
  document.getElementById('feedbackModal').addEventListener('click',e=>{if(e.target.id==='feedbackModal')closeFeedback()});
  document.getElementById('feedbackForm').addEventListener('submit',e=>{
    e.preventDefault(); const p=document.getElementById('feedbackPharmacy').value;
    const type=document.getElementById('feedbackType').selectedOptions[0].textContent;
    const message=document.getElementById('feedbackMessage').value.trim(); if(message.length<5)return;
    const subject='Khénifra Pharma Feedback: '+p;
    const body='Pharmacy: '+p+'\nType: '+type+'\n\n'+message;
    window.location.href='mailto:'+email+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  });
  document.querySelectorAll('.tabs button').forEach(btn=> btn.addEventListener('click', ()=> switchTab(btn.dataset.tab)));
  els.lang.addEventListener('change', e=> setLang(e.target.value));
  els.closeModal.addEventListener('click', closeModal); els.navModal.addEventListener('click', e=>{ if(e.target===els.navModal) closeModal(); }); els.useMyLocation.addEventListener('click', chooseMyLocation); els.showRoute.addEventListener('click', showRoute); els.showPlace.addEventListener('click', showPlace); els.copyContact.addEventListener('click', async ()=>{ try{ await navigator.clipboard.writeText(email); const old=els.copyContact.textContent; els.copyContact.textContent=t('copied'); setTimeout(()=>els.copyContact.textContent=t('copyContact'),1200);}catch(e){window.prompt('Copy email', email);} });

  async function loadWeek(){
    try {
      const res=await fetch('/api/week/current',{cache:'no-store'});
      if(!res.ok) throw new Error('Weekly schedule unavailable');
      const data=await res.json();
      const week=data.week;
      currentWeek=week?{start:week.start,end:week.end}:{start:'',end:''};
      weeklyPharmacies=week?week.pharmacies:[];
      allKnown=[...weeklyPharmacies];
      selectedMapPharmacy=weeklyPharmacies[0]||null;
      renderAll();
    } catch(err){
      currentWeek={start:'',end:''}; weeklyPharmacies=[];allKnown=[];selectedMapPharmacy=null;
      renderAll();console.warn('Weekly schedule unavailable');
    }
  }
  async function loadNight(){
    try {
      const res = await fetch('/api/night/current', {cache:'no-store'});
      if(!res.ok) throw new Error('Night data unavailable');
      const data = await res.json();
      nightSchedule = data.pharmacy ? [data.pharmacy] : [];
      renderAll();
    } catch(err){ nightSchedule=[]; renderAll(); console.warn('Night schedule unavailable'); }
  }
  document.getElementById('shareAppBtn').addEventListener('click',()=>shareThing(null));
  document.getElementById('aboutLink').addEventListener('click',()=>openLegal('about'));
  
  document.getElementById('contactLink').addEventListener('click',()=>openLegal('contact'));
  document.getElementById('closeLegal').addEventListener('click',()=>{document.getElementById('legalModal').classList.remove('open');});
  document.getElementById('legalModal').addEventListener('click',e=>{if(e.target.id==='legalModal')e.target.classList.remove('open');});
  function handleSharedLink(){
    if(!location.hash.startsWith('#pharmacy='))return;
    let id;try{id=decodeURIComponent(location.hash.slice(10));}catch{return;}
    const p=findPharmacy(id);if(!p)return;
    const night=isNightShiftHours() || nightSchedule.some(x=>(x.id||x.name)===id);
    switchTab(night?'night':'today');
    setTimeout(()=>{const el=[...document.querySelectorAll('[data-action="directions"]')].find(x=>x.dataset.id===id);el?.closest('.card')?.scrollIntoView({behavior:'smooth',block:'center'});},120);
  }
  window.addEventListener('hashchange',handleSharedLink);
  // Offline fallback only. Never cache live duty schedules or Maps.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}), {once:true});
  }
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){loadWeek();loadNight();} });
  let lastDutyPeriod = isoToday() + ':' + (isNightShiftHours() ? 'night' : 'day');
  window.setInterval(()=>{ const period=isoToday() + ':' + (isNightShiftHours() ? 'night' : 'day'); if(period !== lastDutyPeriod){ const oldPeriod=lastDutyPeriod; lastDutyPeriod=period; if(oldPeriod.endsWith(':night') && period.endsWith(':day') && document.getElementById('night').classList.contains('active')) switchTab('today'); if(period.endsWith(':night') && document.getElementById('today').classList.contains('active')) switchTab('night'); loadWeek(); loadNight(); renderAll(); } }, 30000);
  
  document.getElementById('skipSplash')?.addEventListener('click', hideSplash);
  window.setTimeout(hideSplash, 2600);

setLang(lang);
  loadWeek().then(handleSharedLink);
  loadNight().then?.(handleSharedLink);
  handleSharedLink();

})();
</script>
</body>
</html>
