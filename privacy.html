<script>
(function(){
 const content={
  ar:{title:'سياسة الخصوصية',updated:'آخر مراجعة: 3 نونبر 2026',intro:'خنيفرة فارما دليل مستقل لصيدليات الحراسة في خنيفرة. لسنا مؤسسة صحية رسمية، ولا نبيع معلوماتك الشخصية.',sections:[
  ['معلومات الموقع','لا نطلب موقعك الجغرافي إلا عند اختيارك استخدام ميزة تحديد موقعك أو الاتجاهات. يتولى المتصفح طلب الإذن؛ ويمكنك رفضه. قد تنتقل بيانات الموقع أو البحث إلى مزود الخريطة عند استخدام الخدمة.'],
  ['بيانات الصيدليات','نعرض أسماء الصيدليات وعناوينها وأرقام هواتفها بناءً على جداول وبيانات محلية. قد تتغير المناوبات أو المواقع؛ يُرجى الاتصال قبل التنقل. تقارير المستخدم لا تعدّل سجلات الصيدليات تلقائياً.'],
  ['الخدمات الخارجية','نستخدم خرائط Google وروابط Waze وApple Maps؛ وتطبق سياسات الخصوصية الخاصة بهذه الخدمات عند فتحها أو عرض خرائطها.'],
  ['التخزين والملاحظات','نحتفظ بتفضيل اللغة في ذاكرة المتصفح المحلية. تُفتح الملاحظات في تطبيق البريد لديك، ولا نحتفظ بقاعدة بيانات عامة للملاحظات داخل الموقع. قد تُعالج استضافة Vercel سجلات تقنية للطلبات وفق إعداداتها. لا تُرسل بيانات صحية شخصية ضمن الملاحظات.'],
  ['التصحيح والتواصل','لطلب تصحيح معلومة، أو الاستفسار عن الخصوصية، تواصل معنا بالبريد أو الهاتف المبين أدناه. نراجع طلبات تغيير بيانات الصيدليات قبل النشر.']]},
  fr:{title:'Politique de confidentialité',updated:'Dernière révision : 3 novembre 2026',intro:'Khénifra Pharma est un guide indépendant des pharmacies de garde à Khénifra. Nous ne sommes pas une autorité de santé et ne vendons pas vos données personnelles.',sections:[
  ['Géolocalisation','Nous ne demandons votre position que si vous choisissez une fonctionnalité de localisation ou d’itinéraire. Le navigateur demande votre autorisation et vous pouvez la refuser. Votre position ou votre recherche peut être transmise au fournisseur de cartes lorsque vous l’utilisez.'],
  ['Données des pharmacies','Les noms, adresses et numéros proviennent des documents et informations locaux. Les gardes et emplacements peuvent changer : appelez avant de partir. Les signalements ne modifient jamais les fiches automatiquement.'],
  ['Services externes','Les cartes Google Maps et les liens vers Waze et Apple Maps sont soumis à leurs propres politiques de confidentialité.'],
  ['Stockage et commentaires','Le choix de langue est enregistré localement dans votre navigateur. Les commentaires ouvrent votre application de messagerie et aucune base de données publique de commentaires n’est conservée sur le site. L’hébergeur Vercel peut traiter des journaux techniques de requêtes. Ne communiquez pas de données médicales personnelles.'],
  ['Corrections et contact','Pour signaler une erreur ou poser une question sur la confidentialité, contactez-nous par e-mail ou téléphone ci-dessous. Les corrections sont examinées avant publication.']]},
  en:{title:'Privacy policy',updated:'Last reviewed: 3 November 2026',intro:'Khénifra Pharma is an independent duty-pharmacy guide in Khénifra. We are not a health authority and do not sell your personal information.',sections:[
  ['Location','We request your location only when you choose a location or directions feature. Your browser asks for permission and you may decline. Your location or search may be sent to the map provider when using that feature.'],
  ['Pharmacy information','Pharmacy names, addresses, phone numbers and duty schedules come from local records. Shifts and locations can change. Call before travelling. Reports never change pharmacy listings automatically.'],
  ['External services','Google Maps embeds and links to Waze and Apple Maps are subject to those providers’ own privacy policies.'],
  ['Storage and feedback','Your language preference is stored locally in your browser. Feedback opens your email app; the website does not maintain a public feedback database. Hosting provider Vercel may process technical request logs. Do not send personal medical information.'],
  ['Corrections and contact','For corrections or privacy questions, contact us through the email address or phone below. We review edits before publishing them.']]}
 };
 const langSelect=document.getElementById('lang');
 function render(v){const lang=content[v]?v:'ar';const x=content[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title=x.title+' | Khénifra Pharma';langSelect.value=lang;document.getElementById('langLabel').textContent=lang==='ar'?'اللغة':lang==='fr'?'Langue':'Language';const target=document.getElementById('policy');target.replaceChildren();const h=document.createElement('h1');h.textContent=x.title;target.append(h);for(const [tag,value] of [['p',x.updated],['p',x.intro]]){const el=document.createElement(tag);el.textContent=value;if(value===x.updated)el.className='muted';target.append(el);}for(const [heading,body] of x.sections){const title=document.createElement('h2');title.textContent=heading;const p=document.createElement('p');p.textContent=body;target.append(title,p);}}
 langSelect.addEventListener('change',()=>render(langSelect.value));let initial='ar';try{initial=localStorage.getItem('kp_lang')||'ar'}catch(e){}render(initial);
})();
